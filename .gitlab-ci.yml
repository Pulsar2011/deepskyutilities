# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#priority-of-environment-variables

# Every job runs in a fresh container of this image: packages installed by one job are not seen by
# the others, so each job installs what it needs (BUILD_PACKAGES below). buildpack-deps:trixie is
# Debian 13 with the build tools already in: GCC 14, make, autoconf/automake/libtool, pkg-config,
# git, curl and the zlib, bzip2 and curl headers. Its apt provides clang 19 and CMake 3.31.
image:
  name: buildpack-deps:trixie

variables:
  GIT_SUBMODULE_STRATEGY: normal
  DEBIAN_FRONTEND: noninteractive
  GIT_DEPTH: "0"
  # Compilers are named explicitly: left to itself, CMake takes /usr/bin/cc and c++, which are GCC 14.
  # Every job that configures must install clang, and llvm for llvm-ar, used by the link-time
  # optimisation of the release build. For GCC 14, set CC: gcc and CXX: g++.
  CC: clang
  CXX: clang++
  # Packages of the build, of the DeepSky libraries it needs (deps job) and of its tests
  BUILD_PACKAGES: "cmake clang llvm libgsl-dev qt6-base-dev libfftw3-dev libopenblas-dev liblapacke-dev astrometry.net gnuplot-nox libcairo2 libpango-1.0-0 libpangocairo-1.0-0"

stages:
- deps
- build
- test
- deploy

.install_packages: &install_packages
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends $BUILD_PACKAGES

# The DeepSky libraries this project links, built from their default branch and installed into
# deepskyproject/, handed to the other jobs as an artifact. Full clones: the libraries take their
# version from the git tags, which find_package(<library> <minimum version>) checks.
deps:
  stage: deps
  before_script: *install_packages
  script:
    - |
      set -e
      export DeepSkyROOT=$(pwd)/deepskyproject
      mkdir -p "$DeepSkyROOT"
      # Builds and installs one DeepSky library into DeepSkyROOT: out of source with the CMake
      # presets when the repository has them, with its former in-source commands otherwise.
      install_deepsky() {
        git clone --recurse-submodules "https://oauth2:${DEEPSKYFITS_TOKEN}@gitlab.in2p3.fr/deepskyproject/$1.git"
        cd "$1"
        if [ -f CMakePresets.json ]; then
          cmake --preset default -DCMAKE_INSTALL_PREFIX="$DeepSkyROOT" -DBUILD_TESTS=OFF
          cmake --build build --parallel 2 --target install
        else
          cmake -DCMAKE_INSTALL_PREFIX="$DeepSkyROOT" -Wno-dev .
          make -j 2
          # The former deepskyfits CMakeLists needs a second configure to list the submodule headers
          cmake -DCMAKE_INSTALL_PREFIX="$DeepSkyROOT" -Wno-dev .
          make -j 2 install
        fi
        cd ..
      }
      install_deepsky deepskyfits
      install_deepsky deepskysys
      install_deepsky deepskymath
      install_deepsky deepskydisplay
  artifacts:
    expire_in: 24 hrs
    paths:
      - deepskyproject/

build:
  stage: build
  needs:
    - job: deps
      artifacts: true
  before_script: *install_packages
  script:
    - git fetch --tags --force || true
    - export DeepSkyROOT=$(pwd)/deepskyproject
    # Same presets as on the workstations (CMakePresets.json): Release build in build/
    - cmake --preset default
    - cmake --build --preset default --parallel 2
  artifacts:
    expire_in: 2 hrs
    paths:
    - build/

test:
  stage: test
  needs:
    - job: build
      artifacts: true
    - job: deps
      artifacts: true
  before_script: *install_packages
  script:
  - export DeepSkyROOT=$(pwd)/deepskyproject
  - export GNUTERM="pngcairo"
  - ctest --preset default

create-pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
    - job: deps
      artifacts: true
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends $BUILD_PACKAGES doxygen graphviz npm
  script:
    - export DeepSkyROOT=$(pwd)/deepskyproject
    - mkdir public
    - npm install mathjax@2
    # Configure again: the build job had no Doxygen, so its build tree has no doc target (nothing is recompiled)
    - cmake --preset default
    - cmake --build --preset default --target doc
    - mv build/doc/html/* ./public
    - mv node_modules/mathjax ./public/mathjax
    - ls public
  pages:
    expire_in: 1 week
